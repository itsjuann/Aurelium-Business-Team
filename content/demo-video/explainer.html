<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aurelium Front Office for HVAC: explainer stage</title>
<style>
/* A 1080x1920 stage for the step-by-step explainer. explainer.js drives it and records it. */
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#070b12;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#world{position:absolute;left:0;top:0;width:2100px;height:3200px;transform-origin:0 0;transition:transform 1.15s cubic-bezier(.65,0,.2,1);will-change:transform;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:70px 70px}
#path{position:absolute;left:0;top:0;width:2100px;height:3200px;overflow:visible}
#path .ghost{fill:none;stroke:rgba(255,255,255,.07);stroke-width:5}
#path .live{fill:none;stroke:#f2c14e;stroke-width:7;stroke-linecap:round;filter:drop-shadow(0 0 10px rgba(242,193,78,.75));transition:stroke-dashoffset 1.15s cubic-bezier(.65,0,.2,1)}
.dot{position:absolute;width:10px;height:10px;border-radius:50%;opacity:.55}

.node{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;background:#0c131d;border:5px solid var(--c);display:grid;place-items:center;
  box-shadow:0 0 0 12px rgba(255,255,255,.04),0 0 38px var(--c);opacity:.25;transition:opacity .6s}
.node.on{opacity:1}
.node svg{width:46px;height:46px}
.node .who{position:absolute;top:-46px;left:50%;transform:translateX(-50%);background:#fff;color:#0c131d;font:800 20px system-ui;padding:3px 12px;border-radius:8px;white-space:nowrap}
.node .lab{position:absolute;top:8px;white-space:nowrap;font:800 30px system-ui;letter-spacing:.01em}
.node .lab small{display:block;font:700 17px ui-monospace,Menlo,monospace;letter-spacing:.16em;color:#9fb0c3;margin-top:2px}
.node.left .lab{right:124px;text-align:right}
.node.right .lab{left:124px;text-align:left}

.card{position:absolute;width:800px;min-height:440px;padding:26px 30px 28px;border-radius:22px;background:rgba(10,16,26,.92);border:3px solid var(--c);
  box-shadow:0 0 0 1px rgba(255,255,255,.04),0 0 46px -6px var(--c),inset 0 0 60px -30px var(--c);opacity:.18;transition:opacity .6s}
.card.on{opacity:1}
.card .head{font:700 19px ui-monospace,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;color:#c7d2de;display:flex;align-items:center;gap:12px;margin-bottom:20px}
.card .head::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
.a{opacity:0;transform:translateY(16px);transition:opacity .45s,transform .45s}
.card.play .a,.a.show{opacity:1;transform:none;transition-delay:var(--d,0s)}
.bubble{border-radius:18px;padding:16px 20px;font:600 30px/1.3 system-ui;max-width:88%}
.bubble.ai{background:var(--c);color:#0c131d;border-bottom-left-radius:6px}
.bubble.them{background:#e9eef4;color:#0c131d;margin:14px 0 0 auto;border-bottom-right-radius:6px}
.bubble .r{display:block;font:800 15px ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;opacity:.7;margin-bottom:4px}
.stat{display:flex;align-items:baseline;gap:18px;margin-top:22px}
.stat b{font:900 78px/1 system-ui;letter-spacing:-.02em;color:var(--c);font-variant-numeric:tabular-nums}
.stat span{font:600 22px/1.25 system-ui;color:#c7d2de}
.note{font:600 22px/1.3 system-ui;color:#9fb0c3;margin-top:16px}

.cal{display:grid;grid-template-columns:110px repeat(4,1fr);gap:10px;align-items:center;font:700 18px ui-monospace,Menlo,monospace;color:#9fb0c3}
.cal i{display:block;height:44px;border-radius:9px;background:rgba(255,255,255,.05)}
.cal i.b{background:#2b3d5a}
.cal i.new{background:var(--c);box-shadow:0 0 22px var(--c);transform:translateY(-70px) scale(.6);opacity:0;transition:transform .55s cubic-bezier(.3,1.5,.5,1),opacity .3s;transition-delay:3s}
.card.play .cal i.new{transform:none;opacity:1}
.booked{margin-top:16px;border-radius:12px;padding:14px 18px;background:var(--c);color:#0c131d;font:800 26px/1.25 system-ui}

.name{font:900 46px/1.05 system-ui;letter-spacing:-.01em}
.tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.tag{font:800 18px system-ui;letter-spacing:.06em;text-transform:uppercase;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.08);color:#dbe4ee}
.tag.hot{background:#4a1d1a;color:#ff9a91}.tag.cool{background:#18304a;color:#86baf5}.tag.new{background:#17342a;color:#74d6a0}.tag.src{background:#3a2f12;color:#f0c56a}

.est{display:flex;justify-content:space-between;align-items:flex-end}
.est b{font:900 76px/1 system-ui;color:var(--c);letter-spacing:-.02em}
.line{position:relative;display:grid;grid-template-columns:repeat(3,1fr);margin-top:34px}
.line::before{content:"";position:absolute;left:8%;right:8%;top:19px;height:4px;background:rgba(255,255,255,.12)}
.day{position:relative;text-align:center;font:800 24px system-ui;color:#9fb0c3}
.day::before{content:"";display:block;width:40px;height:40px;border-radius:50%;margin:0 auto 10px;background:#141c28;border:4px solid rgba(255,255,255,.2);transition:all .35s;transition-delay:var(--d)}
.card.play .day::before{background:var(--c);border-color:var(--c);box-shadow:0 0 20px var(--c)}
.card.play .day{color:#fff;transition:color .3s;transition-delay:var(--d)}
.stamp{position:absolute;right:34px;top:74px;font:900 54px system-ui;letter-spacing:.04em;color:#74d6a0;border:6px solid #74d6a0;border-radius:14px;padding:4px 20px;transform:rotate(-9deg) scale(2.2);opacity:0;transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .2s;transition-delay:var(--d)}
.card.play .stamp{transform:rotate(-9deg) scale(1);opacity:1}

.stars{font-size:74px;line-height:1;letter-spacing:8px;display:flex}
.stars span{color:rgba(255,255,255,.14);transition:color .25s,text-shadow .25s;transition-delay:var(--d)}
.card.play .stars span{color:var(--c);text-shadow:0 0 22px var(--c)}

.gbar{height:26px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:24px}
.gbar i{display:block;height:100%;width:0;border-radius:999px;background:var(--c);box-shadow:0 0 22px var(--c);transition:width 2.6s cubic-bezier(.3,0,.2,1);transition-delay:1.2s}
.card.play .gbar i{width:79.5%}
.gbig{font:900 104px/1 system-ui;letter-spacing:-.03em;color:var(--c)}

#shade{position:fixed;left:0;right:0;top:0;height:470px;z-index:20;background:linear-gradient(180deg,#070b12 0%,#070b12 62%,rgba(7,11,18,0) 100%);pointer-events:none}
#hl{position:fixed;left:30px;right:30px;top:158px;z-index:30;text-align:center;font:900 94px/.98 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:-.035em;text-transform:uppercase;transition:opacity .3s,transform .3s}
#hl.off{opacity:0;transform:translateY(-16px)}
#hl .l2{display:block;color:#f2c14e;text-shadow:0 0 34px rgba(242,193,78,.45)}
#sub{position:fixed;left:60px;right:60px;top:368px;z-index:30;text-align:center;font:700 32px/1.25 system-ui;color:#dbe4ee;opacity:0;transition:opacity .5s}
#sub.on{opacity:1}
#fade{position:fixed;left:0;right:0;bottom:0;height:760px;z-index:20;background:linear-gradient(180deg,rgba(7,11,18,0) 0%,#070b12 30%,#070b12 100%);pointer-events:none;transition:opacity .8s}
#fade.off{opacity:0}
#mark{position:fixed;left:0;right:0;top:1318px;z-index:30;text-align:center;font:700 22px ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:#6f7f91;transition:top .8s}
</style>
</head>
<body>
<div id="world">
  <svg id="path" viewBox="0 0 2100 3200"><path class="ghost"/><path class="live"/></svg>
</div>
<div id="shade"></div>
<div id="hl"><span class="l1"></span><span class="l2"></span></div>
<div id="sub">Aurelium Front Office for HVAC</div>
<div id="fade"></div>
<div id="mark">Demo · sample data</div>

<script>
'use strict';
(function () {
  const HOUSE = '<svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>';
  // One step per node, laid out as a serpentine so the final pull-back shows the whole journey.
  const STEPS = [
    { x: 540, y: 320, c: '#f2c14e', side: 'left', lab: 'Receptionist', sub: 'ANSWERS 24/7', h: ['Every call', 'answered.'],
      card: '<div class="head">Incoming call · 9:14 PM</div>' +
        '<div class="bubble ai a" id="b1"><span class="r">AI receptionist</span>Thanks for calling Demo Heating and Air. This call may be recorded. How can I help?</div>' +
        '<div class="bubble them a" id="b2"><span class="r">Caller</span>My heat\'s out, and it\'s freezing in here.</div>' +
        '<div class="note a" id="b3">Answered in your shop\'s name. Nights and weekends too.</div>' },
    { x: 1500, y: 320, c: '#5fb4ff', side: 'left', lab: 'Booking', sub: 'YOUR REAL CALENDAR', h: ['Booked', 'on the call.'],
      card: '<div class="head">Your calendar · tomorrow</div>' +
        '<div class="cal a"><span>8–11</span><i class="b"></i><i class="new"></i><i class="b"></i><i></i><span>11–2</span><i></i><i class="b"></i><i></i><i class="b"></i><span>2–5</span><i class="b"></i><i></i><i></i><i></i></div>' +
        '<div class="booked a" style="--d:3.4s">No heat · Pat E. · Tomorrow 8 to 11 AM<br>Booked by the AI receptionist</div>' },
    { x: 1500, y: 1020, c: '#ff8a6b', side: 'left', lab: 'CRM', sub: 'EVERY JOB TAGGED', h: ['Every job', 'tagged.'],
      card: '<div class="head">Job J-1050</div><div class="name a">Pat Example</div>' +
        '<div class="tags"><span class="tag src a" style="--d:.3s">Source: AI receptionist, phone call</span><span class="tag hot a" style="--d:.7s">Urgent</span><span class="tag cool a" style="--d:.9s">After hours</span><span class="tag new a" style="--d:1.1s">New customer</span></div>' +
        '<div class="stat a" style="--d:1.7s"><b>$420</b><span>what this job is worth,<br>at the shop\'s own average</span></div>' },
    { x: 540, y: 1020, c: '#5fe0b0', side: 'right', lab: 'Texts', sub: 'CONFIRM + REMIND', h: ['Confirmed', 'by text.'],
      card: '<div class="head">Text to the customer</div>' +
        '<div class="bubble ai a">Demo Heating and Air: you\'re booked for tomorrow between eight and eleven. Your tech will arrive in that window.</div>' +
        '<div class="bubble ai a" style="--d:2s;margin-top:14px"><span class="r">The day before</span>A reminder that your tech arrives tomorrow between eight and eleven.</div>' },
    { x: 540, y: 1720, c: '#b79cff', side: 'right', lab: 'Follow-up', sub: 'DAY 2 · 7 · 14', h: ['Estimates', 'followed up.'],
      card: '<div class="head">Estimate · new furnace</div><div class="est a"><b>$11,500</b></div>' +
        '<div class="line a" style="--d:.4s"><div class="day" style="--d:2.7s">Day 2</div><div class="day" style="--d:3.7s">Day 7</div><div class="day" style="--d:4.7s">Day 14</div></div>' +
        '<div class="note a" style="--d:.8s">Goes out on its own while the estimate is still open.</div><div class="stamp" style="--d:6s">WON</div>' },
    { x: 1500, y: 1720, c: '#ffd166', side: 'left', lab: 'Reviews', sub: 'AFTER EVERY JOB', h: ['Reviews', 'asked for.'],
      card: '<div class="head">After the job</div>' +
        '<div class="stars"><span style="--d:.3s">★</span><span style="--d:.5s">★</span><span style="--d:.7s">★</span><span style="--d:.9s">★</span><span style="--d:1.1s">★</span></div>' +
        '<div class="bubble ai a" style="--d:1.2s;margin-top:22px">Thanks for choosing Demo Heating and Air. Would you leave us a quick Google review?</div>' },
    { x: 1500, y: 2420, c: '#f2c14e', side: 'left', lab: 'Guarantee', sub: 'IN WRITING', h: ['$15,000', 'guaranteed.'],
      card: '<div class="head">90-day guarantee</div><div class="gbig a">$15,000</div>' +
        '<div class="note a" style="--d:.5s;color:#dbe4ee;font-size:28px">in booked jobs in your first 90 days, or the monthly fee pauses.</div>' +
        '<div class="gbar a" style="--d:1s"><i></i></div><div class="note a" style="--d:1.3s">Sample: $11,920 booked so far</div>' },
  ];
  const world = document.getElementById('world');
  const live = document.querySelector('#path .live'), ghost = document.querySelector('#path .ghost');
  // The path: straight runs with a wide turn at each side.
  const SEG = ['M 60 320 H 540', 'H 1500', 'C 1980 320 1980 1020 1500 1020', 'H 540', 'C 60 1020 60 1720 540 1720', 'H 1500', 'C 1980 1720 1980 2420 1500 2420'];
  const full = SEG.join(' ');
  ghost.setAttribute('d', full); live.setAttribute('d', full);
  const total = live.getTotalLength();
  const upTo = SEG.map((_, i) => { const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', SEG.slice(0, i + 1).join(' ')); return p.getTotalLength(); });
  live.style.strokeDasharray = total; live.style.strokeDashoffset = total;

  STEPS.forEach((s, i) => {
    const n = document.createElement('div');
    n.className = `node ${s.side}`; n.id = `n${i}`; n.style.cssText = `left:${s.x}px;top:${s.y}px;--c:${s.c};color:${s.c}`;
    n.innerHTML = `${HOUSE}<span class="who">Pat</span><span class="lab" style="color:#fff">${s.lab}<small>${s.sub}</small></span>`;
    world.appendChild(n);
    const c = document.createElement('div');
    c.className = 'card'; c.id = `c${i}`; c.style.cssText = `left:${s.x - 400}px;top:${s.y + 112}px;--c:${s.c}`;
    c.innerHTML = s.card;
    world.appendChild(c);
  });
  for (let i = 0; i < 26; i++) {
    const d = document.createElement('div'); d.className = 'dot';
    d.style.cssText = `left:${(i * 397) % 2000 + 40}px;top:${(i * 613) % 3000 + 60}px;background:${STEPS[i % 7].c}`;
    world.appendChild(d);
  }
  const hl = document.getElementById('hl');
  function headline(a, b) {
    hl.classList.add('off');
    setTimeout(() => { hl.querySelector('.l1').textContent = a; hl.querySelector('.l2').textContent = b; hl.classList.remove('off'); }, 300);
  }
  const Z = 1.25;
  window.ex = {
    // Move the camera to a step, draw the path up to it, and set its headline.
    go(i) {
      const s = STEPS[i];
      world.style.transform = `translate(${540 - s.x * Z}px, ${560 - s.y * Z}px) scale(${Z})`;
      live.style.strokeDashoffset = total - upTo[i];
      document.getElementById(`n${i}`).classList.add('on');
      document.getElementById(`c${i}`).classList.add('on');
      headline(s.h[0], s.h[1]);
    },
    play(i) { document.getElementById(`c${i}`).classList.add('play'); },
    show(id) { document.getElementById(id).classList.add('show'); },
    // Pull back so the whole journey fits in the frame.
    overview() {
      const z = 0.5;
      world.style.transition = 'transform 1.8s cubic-bezier(.65,0,.2,1)';
      world.style.transform = `translate(${540 - 1020 * z}px, ${470 - 200 * z}px) scale(${z})`;
      document.getElementById('fade').classList.add('off');
      document.getElementById('mark').style.top = '1840px';
      headline('All of it.', 'One system.');
      setTimeout(() => document.getElementById('sub').classList.add('on'), 900);
    },
  };
  window.ex.go(0);
}());
</script>
</body>
</html>
