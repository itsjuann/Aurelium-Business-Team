services:
  - type: web
    name: restaurant-autopilot
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/app.db
      - key: SESSION_SECRET
        generateValue: true
      # Read the generated password under the service's Environment tab.
      - key: ADMIN_PASSWORD
        generateValue: true
# Add later in the dashboard: BASE_URL (custom domain), TWILIO_*, RESEND_API_KEY, EMAIL_FROM.
